<!doctype html>

<x-dc>
<helmet>

<style>

<div style="--bg:#f3efe6;--sf:#fffdf8;--bd:#e0d9c8;--tr:#e9e3d3;--tx:#1f2a1f;--mu:#5f6a58;--ac:#2f6b4f;--wn:#b8442f;--am:#a8780a;width:412px;height:915px;box-sizing:border-box;background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:24px 20px;gap:12px">

<span style="font-size:13px;color:var(--mu)">11/26(木)</span>
</div>

<section class="card" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:14px 0">

<div style="text-align:center;border-left:1px solid var(--bd);border-right:1px solid var(--bd)"><div style="font-size:12px;color:var(--mu)">自己ベスト</div><div style="font-size:30px;font-weight:900;font-family:'Noto Serif JP',serif">45<span style="font-size:13px;font-family:'Noto Sans JP',sans-serif;margin-left:2px">本</span></div></div>
<div style="text-align:center"><div style="font-size:12px;color:var(--mu)">今日の回数</div><div style="font-size:30px;font-weight:900;font-family:'Noto Serif JP',serif">2<span style="font-size:13px;font-family:'Noto Sans JP',sans-serif;margin-left:2px">回</span></div></div>
</section>

<a href="Record.dc.html" style="height:92px;box-sizing:border-box;padding:0 20px;border-radius:20px;background:var(--ac);color:#ffffff;display:flex;align-items:center;gap:16px">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>

<a href="Graph.dc.html" class="card item">

<span style="margin-left:auto;font-size:22px;color:var(--mu)" aria-hidden="true">›</span>

<a href="Detail.dc.html" class="card item">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2f6b4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>

<span style="margin-left:auto;font-size:22px;color:var(--mu)" aria-hidden="true">›</span>

<a href="Settings.dc.html" class="card item">
