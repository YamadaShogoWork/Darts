<!doctype html>

<title>ホーム案B 明るい紺</title>

<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:inherit;text-decoration:none}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px}
.tile{height:88px;box-sizing:border-box;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;height:26px}
.nm{width:44px;font-size:14px;font-weight:700}
.tr{flex:1;height:10px;border-radius:5px;background:var(--tr)}
.vl{width:52px;text-align:right;font-size:14px;font-weight:700}
</style>
</helmet>
<div style="--bg:#f4f6fa;--sf:#ffffff;--bd:#dde3ee;--tr:#e6ebf4;--tx:#101828;--mu:#566074;--ac:#1d3a8a;--wn:#d6453d;--am:#c98a00;width:412px;height:915px;box-sizing:border-box;background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:24px 20px;gap:16px">

<div style="display:flex;align-items:center;justify-content:space-between;height:44px">
<h1 style="margin:0;font-size:22px;font-weight:900;color:var(--ac)">ダーツ練習</h1>
<span style="font-size:13px;color:var(--mu)">11/26(木)</span>
</div>

<section style="background:var(--ac);color:#ffffff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:4px">
<span style="font-size:12px;color:#c9d5f5">今日のメニュー</span>
<span style="font-size:24px;font-weight:900">クリケット10マーク</span>
<span style="font-size:13px;color:#c9d5f5">20→15・ブルを各10マークずつ埋める</span>
<a href="Record.dc.html" style="margin-top:14px;height:60px;border-radius:30px;background:#ffffff;color:var(--ac);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>練習開始
</a>
</section>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<a href="Graph.dc.html" class="card tile">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1d3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
<span><b style="font-size:15px">グラフ</b><br><span style="font-size:12px;color:var(--mu)">日ごとの平均</span></span>
</a>
<a href="Detail.dc.html" class="card tile">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1d3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
<span><b style="font-size:15px">履歴</b><br><span style="font-size:12px;color:var(--mu)">日別の詳細</span></span>
</a>
<a href="Settings.dc.html" class="card tile">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1d3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
<span><b style="font-size:15px">設定</b><br><span style="font-size:12px;color:var(--mu)">バックアップ</span></span>
</a>
<div class="tile" style="border:1.5px dashed #aeb8cc;border-radius:18px;color:var(--mu)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<span><b style="font-size:15px">メニュー追加</b><br><span style="font-size:12px">準備中</span></span>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<div class="card" style="padding:14px">
<div style="font-size:12px;color:var(--mu)">今日の平均(2回)</div>
<div style="font-size:32px;font-weight:900;margin-top:2px">49<span style="font-size:15px;margin-left:2px">本</span></div>
</div>
<div class="card" style="padding:14px">
<div style="font-size:12px;color:var(--mu)">自己ベスト</div>
<div style="font-size:32px;font-weight:900;margin-top:2px">45<span style="font-size:15px;margin-left:2px">本</span></div>
</div>
</div>

<section class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:6px">
<span style="font-size:14px;font-weight:700">苦手ナンバー(直近7日の平均)</span>
<div class="row"><span class="nm">ブル</span><div class="tr"><div style="width:93%;height:10px;border-radius:5px;background:var(--wn)"></div></div><span class="vl">9.3本</span></div>
<div class="row"><span class="nm">16</span><div class="tr"><div style="width:84%;height:10px;border-radius:5px;background:var(--am)"></div></div><span class="vl">8.4本</span></div>
</section>

</div>
</x-dc>
