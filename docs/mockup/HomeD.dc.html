<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム案D 二択ボタン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid #ffd166;outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px}
.lk{flex:1;height:48px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--mu)}
</style>
</helmet>
<div style="--bg:#0b0b0c;--sf:#171718;--bd:#2a2a2d;--tr:#242427;--tx:#f4f4f5;--mu:#a1a1aa;--ac:#ff5a5f;--ak:#1a0506;--wn:#ff5a5f;--am:#ffd166;width:412px;height:915px;box-sizing:border-box;background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:24px 20px">

<div style="display:flex;align-items:center;justify-content:space-between;height:44px">
<h1 style="margin:0;font-size:22px;font-weight:900">ダーツ練習</h1>
<span style="font-size:13px;color:var(--mu)">11/26(木) ・ クリケット10マーク</span>
</div>

<section class="card" style="margin-top:12px;padding:20px;display:flex;justify-content:space-between;align-items:flex-end">
<div>
<div style="font-size:13px;color:var(--mu)">今日の平均本数</div>
<div style="font-size:120px;line-height:1;font-weight:900;letter-spacing:-4px">49<span style="font-size:26px;font-weight:700;letter-spacing:0;margin-left:4px">本</span></div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;text-align:right;padding-bottom:12px">
<div><div style="font-size:12px;color:var(--mu)">自己ベスト</div><div style="font-size:26px;font-weight:900;color:var(--ac)">45<span style="font-size:13px;margin-left:2px;color:var(--tx)">本</span></div></div>
<div><div style="font-size:12px;color:var(--mu)">今日の練習</div><div style="font-size:26px;font-weight:900">2<span style="font-size:13px;margin-left:2px">回</span></div></div>
</div>
</section>

<a href="Graph.dc.html" class="card" style="margin-top:12px;display:block;padding:12px 16px">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:14px;font-weight:700">14日間の推移</span>
<span style="font-size:13px;color:var(--ac);font-weight:700">64本 → 49本</span>
</div>
<svg viewBox="0 0 340 80" width="100%" height="76" role="img" aria-label="直近14日の日ごとの平均本数。64本から49本に減っている" style="display:block;margin-top:6px">
<line x1="4" y1="72" x2="336" y2="72" stroke="#2a2a2d"/>
<polyline points="4,20.8 29.5,27.2 55.1,22.9 80.6,33.6 106.2,29.3 131.7,35.7 157.2,31.5 182.8,40 208.3,37.9 233.9,44.3 259.4,42.1 285,48.5 310.5,46.4 336,52.8" fill="none" stroke="#ff5a5f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="336" cy="52.8" r="4" fill="#ff5a5f"/>
</svg>
</a>

<div style="margin-top:12px;display:flex;gap:8px;align-items:center">
<span style="font-size:13px;color:var(--mu);margin-right:2px">苦手</span>
<span style="height:34px;box-sizing:border-box;padding:0 14px;border-radius:17px;border:1px solid var(--wn);color:var(--wn);font-size:13px;font-weight:700;display:flex;align-items:center">ブル 9.3本</span>
<span style="height:34px;box-sizing:border-box;padding:0 14px;border-radius:17px;border:1px solid var(--am);color:var(--am);font-size:13px;font-weight:700;display:flex;align-items:center">16 8.4本</span>
</div>

<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;color:var(--mu)">途中の練習があります(11:32 ・ ナンバー19 ・ 5/10)</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<a href="Record.dc.html" style="height:112px;border-radius:22px;border:2px solid var(--ac);color:var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
<span style="font-size:22px;font-weight:900">続きから</span><span style="font-size:12px;color:var(--mu)">19 ・ 5/10 から再開</span>
</a>
<a href="Record.dc.html" style="height:112px;border-radius:22px;background:var(--ac);color:var(--ak);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
<span style="font-size:22px;font-weight:900">新しく始める</span><span style="font-size:12px;font-weight:700">20 から</span>
</a>
</div>
<div style="display:flex;border-top:1px solid var(--bd);margin-top:8px">
<a href="Graph.dc.html" class="lk">グラフ</a>
<a href="Detail.dc.html" class="lk" style="border-left:1px solid var(--bd);border-right:1px solid var(--bd)">履歴</a>
<a href="Settings.dc.html" class="lk">設定</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
