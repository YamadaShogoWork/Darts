<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>記録入力</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #ffd166;outline-offset:2px}
button{font-family:inherit;cursor:pointer;border:0}
button:disabled{cursor:default}
</style>
</helmet>
<div style="width:412px;height:915px;box-sizing:border-box;background:#0f1411;color:#eef3ef;font-family:'Noto Sans JP',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:24px 20px 24px">

<div style="display:flex;align-items:center;justify-content:space-between;height:48px">
<a href="Main.dc.html" aria-label="ホームへ戻る" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-10px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 style="margin:0;font-size:16px;font-weight:700">クリケット10マーク</h1>
<span style="font-size:14px;color:#9db0a4;min-width:60px;text-align:right">合計 <b style="color:#eef3ef;font-size:18px">{{total}}</b>本</span>
</div>

<div style="display:flex;gap:6px;margin-top:12px" role="list" aria-label="ナンバーの進み具合">
<sc-for list="{{ rail }}" as="r" hint-placeholder-count="7">
<div role="listitem" style="flex:1;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;box-sizing:border-box;{{ r.st }}">
<span style="font-size:16px">{{ r.label }}</span>
<span style="font-size:11px;font-weight:500">{{ r.sub }}</span>
</div>
</sc-for>
</div>

<section style="margin-top:16px;background:#18201b;border:1px solid #2b382f;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<span style="font-size:12px;color:#9db0a4">いまのナンバー</span>
<span style="font-size:14px;font-weight:700">マーク <span style="font-size:22px;font-weight:900;color:#3ddc84">{{curMarks}}</span> / 10</span>
</div>
<div style="font-size:112px;line-height:1;font-weight:900;text-align:center;letter-spacing:-2px;padding:4px 0">{{curName}}</div>
<div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px" role="img" aria-label="10マーク中{{curMarks}}マーク">
<sc-for list="{{ segs }}" as="g" hint-placeholder-count="10">
<div style="height:12px;border-radius:4px;{{ g.st }}"></div>
</sc-for>
</div>
<div style="display:flex;gap:6px;align-items:center;min-height:30px;flex-wrap:wrap">
<span style="font-size:12px;color:#9db0a4;margin-right:4px">このナンバーの投げ</span>
<sc-for list="{{ seq }}" as="s" hint-placeholder-count="5">
<span style="min-width:30px;height:30px;box-sizing:border-box;padding:0 6px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;{{ s.st }}">{{ s.text }}</span>
</sc-for>
</div>
</section>

<div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;height:40px">
<span style="font-size:15px;font-weight:700">{{turnText}}</span>
<div style="display:flex;gap:10px" aria-hidden="true">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
<span style="width:18px;height:18px;border-radius:9px;box-sizing:border-box;{{ d.st }}"></span>
</sc-for>
</div>
</div>

<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">

<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<div style="background:#1d3a2a;border:1px solid #2f6a49;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;height:204px;box-sizing:border-box;justify-content:center">
<span style="font-size:20px;font-weight:900;color:#3ddc84">ブルまで完了!</span>
<span style="font-size:15px">合計 <b style="font-size:28px">{{total}}</b> 本</span>
<a href="Result.dc.html" style="height:56px;width:100%;border-radius:16px;background:#3ddc84;color:#06210f;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center">結果を見る</a>
</div>
</sc-if>

<sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<button onClick="{{ tap0 }}" style="height:96px;border-radius:20px;background:#222d26;color:#eef3ef;font-size:20px;font-weight:700;border:1px solid #2b382f">ミス<br><span style="font-size:13px;font-weight:500;color:#9db0a4">0マーク</span></button>
<button onClick="{{ tap1 }}" style="height:96px;border-radius:20px;background:#2f5a41;color:#ffffff;font-size:20px;font-weight:700">{{label1}}<br><span style="font-size:13px;font-weight:500;color:#cfeedd">1マーク</span></button>
<button onClick="{{ tap2 }}" style="height:96px;border-radius:20px;background:#3a8a5f;color:#ffffff;font-size:20px;font-weight:700">{{label2}}<br><span style="font-size:13px;font-weight:500;color:#e6fff0">2マーク</span></button>
<button onClick="{{ tap3 }}" disabled="{{ isBull }}" style="height:96px;border-radius:20px;background:#3ddc84;color:#06210f;font-size:20px;font-weight:900;{{ tripleSt }}">トリプル<br><span style="font-size:13px;font-weight:700">3マーク</span></button>
</div>
</sc-if>

<div style="display:flex;gap:12px">
<button onClick="{{ undo }}" style="flex:1;height:52px;border-radius:16px;background:transparent;border:1px solid #5b6f62;color:#eef3ef;font-size:15px;font-weight:700">1投取り消す</button>
<a href="Main.dc.html" style="flex:1;height:52px;border-radius:16px;border:1px solid #2b382f;color:#9db0a4;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center">中断して戻る</a>
</div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      log: [
        { t: 0, v: 3, a: 3 }, { t: 0, v: 1, a: 1 }, { t: 0, v: 3, a: 3 }, { t: 0, v: 0, a: 0 }, { t: 0, v: 3, a: 3 },
        { t: 1, v: 2, a: 2 }, { t: 1, v: 3, a: 3 }, { t: 1, v: 0, a: 0 }
      ]
    };
  }
  renderVals() {
    const names = ['20', '19', '18', '17', '16', '15', 'BULL'];
    const log = this.state.log;
    const marks = [0, 0, 0, 0, 0, 0, 0];
    const darts = [0, 0, 0, 0, 0, 0, 0];
    log.forEach((e) => { marks[e.t] += e.a; darts[e.t] += 1; });
    let idx = 0;
    while (idx < 7 && marks[idx] >= 10) idx++;
    const done = idx >= 7;
    const total = log.length;
    const inTurn = total % 3;
    const turnNo = Math.floor(total / 3) + 1;
    const showIdx = done ? 6 : idx;
    const tap = (v) => () => {
      if (done) return;
      const a = Math.min(v, 10 - marks[idx]);
      this.setState({ log: [...log, { t: idx, v: v, a: a }] });
    };
    const chipSt = ['background:#222d26;color:#9db0a4', 'background:#26402f;color:#bdf0d2', 'background:#2f5a41;color:#e6fff0', 'background:#3ddc84;color:#06210f'];
    return {
      total: total,
      done: done,
      notDone: !done,
      isBull: idx === 6,
      curName: done ? '完了' : names[idx],
      curMarks: marks[showIdx],
      turnText: done ? '練習おつかれさま' : 'ターン' + turnNo + ' ・ ' + (inTurn + 1) + '投目',
      label1: idx === 6 ? 'シングルブル' : 'シングル',
      label2: idx === 6 ? 'ダブルブル' : 'ダブル',
      tripleSt: idx === 6 ? 'opacity:0.3' : '',
      rail: names.map((n, i) => {
        const isDone = marks[i] >= 10;
        const isCur = i === idx;
        return {
          label: n === 'BULL' ? 'B' : n,
          sub: isDone ? darts[i] + '本' : (isCur ? '投げ中' : '—'),
          st: isDone ? 'background:#1d3a2a;color:#3ddc84;border:1px solid #2f6a49' : (isCur ? 'background:#3ddc84;color:#06210f;border:1px solid #3ddc84' : 'background:#18201b;color:#9db0a4;border:1px solid #2b382f')
        };
      }),
      segs: Array.from({ length: 10 }, (_, i) => ({ st: i < marks[showIdx] ? 'background:#3ddc84' : 'background:#2b382f' })),
      seq: log.filter((e) => e.t === showIdx).map((e) => ({ text: e.v === e.a ? String(e.v) : e.v + '→' + e.a, st: chipSt[e.v] })),
      dots: [0, 1, 2].map((i) => ({ st: (!done && i < inTurn) ? 'background:#3ddc84;border:2px solid #3ddc84' : 'background:transparent;border:2px solid #5b6f62' })),
      tap0: tap(0), tap1: tap(1), tap2: tap(2), tap3: tap(3),
      undo: () => { if (log.length) this.setState({ log: log.slice(0, -1) }); }
    };
  }
}
</script>
</body>
</html>
